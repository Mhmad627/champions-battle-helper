# The service worker (sw.js) serves the whole site from its cache, so phones only get a new version of the
# site when VERSION in sw.js goes up. This check fails (red X) when site files change but VERSION doesn't.
# It never changes or commits anything.
name: Version check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Site changes need a higher VERSION in sw.js
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with."; exit 0
          fi
          # Only sw.js and the files it stores in its VERSION cache (its FILES list) need a new VERSION.
          # Other files (tools, docs, the share image, the Pokémon icons, which have their own cache) don't.
          node -e '
            const src = require("fs").readFileSync("sw.js", "utf8");
            const FILES = new Function(src.slice(src.indexOf("const TYPES"), src.indexOf("];", src.indexOf("const FILES")) + 2) + "; return FILES")();
            for (const f of ["sw.js", ...FILES]) console.log(f === "./" ? "index.html" : f);
          ' > cached.txt
          changed=$(git diff --name-only "$BASE" HEAD | grep -xFf cached.txt || true)
          if [ -z "$changed" ]; then echo "No site files changed."; exit 0; fi
          old=$(git show "$BASE:sw.js" 2>/dev/null | grep -oE "cbh-v[0-9]+" | head -1)
          new=$(grep -oE "cbh-v[0-9]+" sw.js | head -1)
          if [ -z "$old" ] || [ "${new#cbh-v}" -gt "${old#cbh-v}" ]; then echo "VERSION went from ${old:-nothing} to $new."; exit 0; fi
          echo "::error file=sw.js::Site files changed but VERSION in sw.js is still $old, so phones would keep showing the old site. Bump VERSION."
          echo "Changed files that phones keep a copy of:"; echo "$changed"
          exit 1
