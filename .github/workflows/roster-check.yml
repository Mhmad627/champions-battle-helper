# Weekly check of the Champions roster against Serebii's list.
# If anything changed, it opens (or updates) a pull request for you to review and merge.
# If Serebii's page can't be read, the run fails and GitHub emails you; nothing is changed.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Weekly roster check

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exit codes: 0 fine, 2 page unreadable (nothing changed), 3 something to check by hand.
      - name: Compare with Serebii
        id: check
        run: |
          code=0
          python tools/check_roster.py --write --summary "$RUNNER_TEMP/roster-changes.md" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Open a pull request if the roster changed
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '3'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: roster-update
          delete-branch: true
          add-paths: |
            data/champions.js
            sw.js
          commit-message: Update Champions roster from Serebii
          title: Champions roster update
          body-path: ${{ runner.temp }}/roster-changes.md

      # Fail the run (GitHub emails you) if the page couldn't be read or something needs checking by hand.
      - name: Report problems
        if: steps.check.outputs.code != '0'
        run: |
          echo "The roster check needs attention (exit code ${{ steps.check.outputs.code }}). See the 'Compare with Serebii' step above."
          exit 1
